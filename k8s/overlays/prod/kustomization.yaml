apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisvolt
resources:
  - ../../base
configMapGenerator:
  - name: aegisvolt-config
    behavior: create
    options:
      disableNameSuffixHash: true
    literals:
      - ENVIRONMENT=prod
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://aws-private-endpoint:4566
      - CLOUDWATCH_ENABLED=true
      - LOG_LEVEL=info
      - SURGE_PEAK_HOURS=7-9,17-21
      - SURGE_TIMEZONE=America/Bogota
      - TELEMETRY_INTERVAL_MS=5000
      - PREFECT_API_URL=http://prefect-api:4200/api
      - PREFECT_UI_URL=http://localhost:4200
      - ALLOW_FLAG_MUTATIONS=false
replicas:
  - name: graphql-gateway-stable
    count: 4
  - name: station-reservation-service-stable
    count: 4
  - name: billing-wallet-service-stable
    count: 4
  - name: energy-dispatch-service-stable
    count: 4
