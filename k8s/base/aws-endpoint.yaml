# Solo Floci: Service sin selector + Endpoints apuntando a la IP privada de Floci dentro de la VPC.
# Equivale al VPC Endpoint privado: los pods hablan con "DynamoDB/CloudWatch" sin salir a internet.
# El script de despliegue reemplaza FLOCI_IP. En AWS real este archivo no se usa (los VPCE resuelven por DNS privado).
apiVersion: v1
kind: Service
metadata:
  name: aws-private-endpoint
spec:
  ports:
    - port: 4566
      targetPort: 4566
---
apiVersion: v1
kind: Endpoints
metadata:
  name: aws-private-endpoint
subsets:
  - addresses:
      - ip: FLOCI_IP
    ports:
      - port: 4566
